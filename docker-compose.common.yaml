---
x-redis-common: &redis-common
  image: ${REDIS_IMAGE:-redis:7}
  restart: unless-stopped

x-sentinel-common: &sentinel-common
  <<: *redis-common
  command:
    - sh
    - -c
    - |
      cat >/tmp/sentinel.conf <<'EOF'
      bind 0.0.0.0
      port 26379
      sentinel monitor redis_ha ${MASTER_IP} ${MASTER_PORT} 2
      sentinel down-after-milliseconds redis_ha 5000
      sentinel failover-timeout redis_ha 10000
      sentinel parallel-syncs redis_ha 1
      protected-mode no
      EOF
      exec redis-server /tmp/sentinel.conf --sentinel

services:
  redis-base:
    <<: *redis-common

  sentinel-base:
    <<: *sentinel-common
