---
services:
  redis-replica:
    extends:
      file: ./docker-compose.includes.yaml
      service: redis-base
    container_name: redis-replica
    volumes:
      - ./data/replica:/data
    command:
      - redis-server
      - --bind
      - 0.0.0.0
      - --port
      - "6379"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --protected-mode
      - "no"
      - --replicaof
      - ${HOST_ENV_IP:-${MASTER_IP}}
      - ${MASTER_PORT}
      - --replica-announce-ip
      - ${HOST_ENV_IP:-${REPLICA_IP}}
      - --replica-announce-port
      - ${REPLICA_PORT}
    ports:
      - "${REPLICA_PORT:-20002}:6379"


  sentinel-second:
    extends:
      file: ./docker-compose.includes.yaml
      service: sentinel-base
    container_name: sentinel-second
    ports:
      - "${SENTINEL_SECOND_PORT:-30002}:26379"
