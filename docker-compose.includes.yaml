---
x-extra-hosts-common: &extra-hosts-common
  - "host.docker.internal:host-gateway"
  - "env-host:${HOST_ENV_IP:-${MASTER_IP}}"
  - "redis-master:${MASTER_IP}"
  - "redis-replica:${REPLICA_IP}"
  - "sentinel-first:${SENTINEL_FIRST_IP}"
  - "sentinel-second:${SENTINEL_SECOND_IP}"
  - "sentinel-third:${SENTINEL_THIRD_IP}"

x-redis-common: &redis-common
  image: ${REDIS_IMAGE:-redis:7}
  restart: unless-stopped
  extra_hosts: *extra-hosts-common

x-sentinel-common: &sentinel-common
  <<: *redis-common
  command:
    - sh
    - -c
    - |
      cat >/tmp/sentinel.conf <<EOF
      bind 0.0.0.0
      port 26379
      sentinel resolve-hostnames yes
      sentinel monitor ${MASTER_SERVICE_NAME:-redis_ha} ${SENTINEL_MONITOR_HOST:-${HOST_ENV_IP:-${MASTER_IP}}} ${SENTINEL_MONITOR_PORT:-${MASTER_PORT:-20001}} 2
      sentinel down-after-milliseconds ${MASTER_SERVICE_NAME:-redis_ha} 3000
      sentinel failover-timeout ${MASTER_SERVICE_NAME:-redis_ha} 10000
      sentinel parallel-syncs ${MASTER_SERVICE_NAME:-redis_ha} 1
      protected-mode no
      EOF
      exec redis-server /tmp/sentinel.conf --sentinel

services:
  redis-base:
    <<: *redis-common

  sentinel-base:
    <<: *sentinel-common
